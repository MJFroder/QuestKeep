{"name": "Zbuduj aplikację na Androida", "on": {"push": {"branches": ["main"]}, "workflow_dispatch": {}}, "permissions": {"contents": "write"}, "jobs": {"apk": {"runs-on": "ubuntu-latest", "steps": [
{"uses": "actions/checkout@v5"},
{"uses": "actions/setup-java@v5", "with": {"distribution": "temurin", "java-version": "17"}},
{"name": "Pakiety Android (najnowsza wersja)", "run": "SDKM=\"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager\"\n(yes || true) | \"$SDKM\" --licenses > /dev/null || true\n\"$SDKM\" --list > list.txt 2> /dev/null || true\nAPI=$(grep -oE \"platforms;android-[0-9]+[[:space:]]\" list.txt | grep -oE \"[0-9]+\" | sort -n | tail -1)\nAPI=${API:-36}\necho \"Najnowszy Android SDK: $API\"\n(yes || true) | \"$SDKM\" \"platforms;android-$API\" \"platform-tools\" > /dev/null\nsed -i \"s/compileSdk = 37/compileSdk = $API/; s/targetSdk = 37/targetSdk = $API/\" android/app/build.gradle\ngrep -E \"compileSdk|targetSdk\" android/app/build.gradle\n"},
{"uses": "gradle/actions/setup-gradle@v5", "with": {"gradle-version": "9.6.0"}},
{"name": "Skopiuj aplikację do projektu Androida", "run": "rm -rf android/app/src/main/assets/www\nmkdir -p android/app/src/main/assets/www\ncp index.html games.js android/app/src/main/assets/www/\ncp -r icons android/app/src/main/assets/www/\n"},
{"name": "Zbuduj APK", "run": "gradle -p android assembleRelease --no-daemon --stacktrace"},
{"name": "Nazwa pliku", "run": "cp android/app/build/outputs/apk/release/app-release.apk BoardGameCalendar.apk"},
{"uses": "actions/upload-artifact@v4", "with": {"name": "BoardGameCalendar-apk", "path": "BoardGameCalendar.apk"}},
{"name": "Opublikuj w Releases", "uses": "softprops/action-gh-release@v2", "with": {"tag_name": "android-${{ github.run_number }}", "name": "BoardGameCalendar (wersja ${{ github.run_number }})", "body": "Pobierz BoardGameCalendar.apk na telefonie i otwórz go.", "files": "BoardGameCalendar.apk", "make_latest": true}}], "timeout-minutes": 30}}}
